services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  app:
    build: .
    ports: ["8000:8000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: troque-esta-chave-em-producao
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin123
    volumes:
      - ./modelos:/app/modelos
      - ./data:/app/data
    depends_on: [mongo, redis]

volumes:
  mongo_data:
